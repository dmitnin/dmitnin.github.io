<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stardew Valley — Bundle Cheatsheet</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap');

  :root {
    --spring:  #5db85c;
    --summer:  #e07b39;
    --fall:    #c0582a;
    --winter:  #5b8fc7;
    --special: #9b59b6;
    --bg:      #1a1409;
    --card:    #2c2010;
    --border:  #5a3e1b;
    --text:    #f0ddb0;
    --muted:   #a08050;
    --done-bg: #111;
    --done-text:#555;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Lato', sans-serif;
    font-size: 14px;
    line-height: 1.5;
  }

  header {
    background: #0d0b06;
    border-bottom: 2px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 14px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  header h1 { font-size: 20px; color: #f5c842; letter-spacing: .04em; }
  header small { color: var(--muted); font-size: 12px; }

  nav {
    display: flex;
    gap: 6px;
    margin-left: auto;
    flex-wrap: wrap;
  }
  nav a {
    text-decoration: none;
    padding: 5px 14px;
    border-radius: 20px;
    font-weight: 700;
    font-size: 13px;
    transition: opacity .15s;
  }
  nav a:hover { opacity: .8; }
  nav a.spring  { background: var(--spring);  color: #fff; }
  nav a.summer  { background: var(--summer);  color: #fff; }
  nav a.fall    { background: var(--fall);    color: #fff; }
  nav a.winter  { background: var(--winter);  color: #fff; }
  nav a.special { background: var(--special); color: #fff; }

  main { max-width: 960px; margin: 0 auto; padding: 24px 16px 60px; }

  .season-block { margin-bottom: 48px; }

  .season-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 18px;
    border-radius: 8px 8px 0 0;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: .05em;
    color: #fff;
    margin-bottom: 2px;
  }
  .season-header.spring  { background: var(--spring); }
  .season-header.summer  { background: var(--summer); }
  .season-header.fall    { background: var(--fall); }
  .season-header.winter  { background: var(--winter); }
  .season-header.special { background: var(--special); }

  .season-body {
    border: 1px solid var(--border);
    border-radius: 0 0 8px 8px;
    padding: 0;
    overflow: hidden;
  }

  .subsection { border-bottom: 1px solid var(--border); }
  .subsection:last-child { border-bottom: none; }

  .subsection-title {
    background: #221808;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .1em;
    color: #c8a050;
    cursor: pointer;
    user-select: none;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .subsection-title::after { content: '▾'; font-size: 12px; }
  .subsection-title.collapsed::after { content: '▸'; }

  .subsection-content { padding: 4px 0; }
  .subsection-content.hidden { display: none; }

  .item-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 16px;
    border-radius: 4px;
    transition: background .1s;
    cursor: pointer;
  }
  .item-row:hover { background: #382c14; }
  .item-row.checked { background: var(--done-bg); opacity: .5; }
  .item-row.checked .item-name { text-decoration: line-through; color: var(--done-text); }
  .item-row.checked .item-bundle { color: #444; }

  .item-row input[type=checkbox] {
    appearance: none;
    width: 16px; height: 16px;
    border: 2px solid var(--border);
    border-radius: 3px;
    cursor: pointer;
    flex-shrink: 0;
    position: relative;
    background: var(--card);
  }
  .item-row input[type=checkbox]:checked { background: #5a3e1b; border-color: #c8a050; }
  .item-row input[type=checkbox]:checked::after {
    content: '✓';
    position: absolute;
    top: -2px; left: 2px;
    font-size: 12px;
    color: #f5c842;
  }

  .item-icon { width: 48px; height: 48px; image-rendering: pixelated; flex-shrink: 0; }
  .item-name { font-weight: 700; color: var(--text); min-width: 160px; }
  .item-bundle { color: var(--muted); font-size: 12px; }
  .item-note { color: #e07b39; font-size: 12px; font-style: italic; margin-left: auto; }

  .badge { font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 10px; white-space: nowrap; }
  .badge.year2 { background: #5a1e8a; color: #ddaaff; }
  .badge.rare  { background: #1a4a6a; color: #aaddff; }

  .todo-list { padding: 8px 16px 8px 32px; }
  .todo-list li { padding: 3px 0; color: var(--text); font-size: 13px; }
  .todo-list li span.hl { color: #f5c842; font-weight: 700; }

  .progress-wrap {
    margin: 12px 0 4px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .progress-bar-outer { flex: 1; height: 8px; background: #111; border-radius: 4px; overflow: hidden; }
  .progress-bar-inner {
    height: 100%;
    background: linear-gradient(90deg, #5db85c, #f5c842);
    border-radius: 4px;
    transition: width .3s;
  }
  .progress-label { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .reset-btn {
    margin-left: auto;
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 3px 10px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 11px;
  }
  .reset-btn:hover { color: var(--text); border-color: var(--text); }
</style>
</head>

<div class="season-block" id="special">

function key(season, section, name) { return `sdv_${season}_${section}_${name}`; }

function renderItems(items, season, section, container) {
  items.forEach(item => {
    const k = key(season, section, item.name);
    const checked = localStorage.getItem(k) === '1';
    const row = document.createElement('div');
    row.className = 'item-row' + (checked ? ' checked' : '');

    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = checked;

    const iconEl = document.createElement('img');
    iconEl.className = 'item-icon';
    iconEl.src = img(item.icon);
    iconEl.alt = '';
    iconEl.onerror = function() { this.style.visibility = 'hidden'; };

    const nameEl = document.createElement('span');
    nameEl.className = 'item-name';
    nameEl.textContent = item.name;

    const bundleEl = document.createElement('span');
    bundleEl.className = 'item-bundle';
    bundleEl.textContent = item.bundle;

    row.appendChild(cb);
    row.appendChild(iconEl);
    row.appendChild(nameEl);
    row.appendChild(bundleEl);

    if (item.badge) {
      const b = document.createElement('span');
      b.className = 'badge ' + item.badge;
      b.textContent = item.badge === 'year2' ? 'Year 2+' : 'Rare';
      row.appendChild(b);
    }
    if (item.note) {
      const n = document.createElement('span');
      n.className = 'item-note';
      n.textContent = item.note;
      row.appendChild(n);
    }

    const toggle = (checked) => {
      localStorage.setItem(k, checked ? '1' : '0');
      row.classList.toggle('checked', checked);
      updateProgress();
    };
    row.addEventListener('click', e => { if (e.target === cb) return; cb.checked = !cb.checked; toggle(cb.checked); });
    cb.addEventListener('change', () => toggle(cb.checked));
    container.appendChild(row);
  });
}

function renderSection(title, items, season, section, body, isTodo) {
  const wrap = document.createElement('div');
  wrap.className = 'subsection';
  const titleEl = document.createElement('div');
  titleEl.className = 'subsection-title';
  titleEl.textContent = title;
  const content = document.createElement('div');
  content.className = 'subsection-content';
  titleEl.addEventListener('click', () => { titleEl.classList.toggle('collapsed'); content.classList.toggle('hidden'); });
  if (isTodo) {
    const ul = document.createElement('ul');
    ul.className = 'todo-list';
    items.forEach(t => { const li = document.createElement('li'); li.innerHTML = '→ ' + t; ul.appendChild(li); });
    content.appendChild(ul);
  } else {
    renderItems(items, season, section, content);
  }
  wrap.appendChild(titleEl);
  wrap.appendChild(content);
  body.appendChild(wrap);
}

['spring','summer','fall','winter'].forEach(s => {
  const d = data[s], body = document.getElementById(s + '-body');
  renderSection('🌱 Plant',   d.plant,   s, 'plant',   body);
  renderSection('🍃 Forage',  d.forage,  s, 'forage',  body);
  renderSection('🎣 Fishing', d.fishing, s, 'fishing', body);
  renderSection('✅ To Do',   d.todo,    s, 'todo',    body, true);
});
renderSection('⚙️ Year-Round & Exceptional Items', data.special.yearround, 'special', 'yr', document.getElementById('special-body'));

function updateProgress() {
  const all = document.querySelectorAll('.item-row'), done = document.querySelectorAll('.item-row.checked');
  const pct = all.length ? Math.round(done.length / all.length * 100) : 0;
  document.getElementById('prog-label').textContent = `${done.length} / ${all.length} items checked`;
  document.getElementById('prog-bar').style.width = pct + '%';
}

function resetAll() {
  if (!confirm('Reset all checkboxes?')) return;
  Object.keys(localStorage).filter(k => k.startsWith('sdv_')).forEach(k => localStorage.removeItem(k));
  document.querySelectorAll('.item-row').forEach(r => { r.classList.remove('checked'); r.querySelector('input').checked = false; });
  updateProgress();
}

updateProgress();

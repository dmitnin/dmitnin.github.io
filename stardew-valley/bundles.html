<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stardew Valley — Bundle Cheatsheet</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap');

  :root {
    --bg:      #1a1409;
    --card:    #2c2010;
    --border:  #5a3e1b;
    --text:    #f0ddb0;
    --muted:   #a08050;
    --done-bg: #111;
    --done-fg: #555;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Lato', sans-serif;
    font-size: 14px;
    line-height: 1.5;
  }

  /* ── Header ──────────────────────────────────────────────────────────── */
  header {
    background: #0d0b06;
    border-bottom: 2px solid var(--border);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    gap: 14px;
    position: sticky;
    top: 0;
    z-index: 100;
    flex-wrap: wrap;
  }
  header h1 { font-size: 20px; color: #f5c842; letter-spacing: .04em; }
  header small { color: var(--muted); font-size: 12px; }

  nav { display: flex; gap: 5px; flex-wrap: wrap; margin-left: auto; }
  nav a {
    text-decoration: none;
    padding: 4px 12px;
    border-radius: 20px;
    font-weight: 700;
    font-size: 12px;
    color: #fff;
    transition: opacity .15s;
  }
  nav a:hover { opacity: .8; }

  /* ── Progress bar ────────────────────────────────────────────────────── */
  .progress-wrap {
    position: sticky;
    top: 53px;
    z-index: 99;
    background: #0d0b06;
    border-bottom: 1px solid var(--border);
    padding: 8px 24px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .progress-label { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .progress-bar-outer { flex: 1; height: 6px; background: #111; border-radius: 3px; overflow: hidden; }
  .progress-bar-inner {
    height: 100%;
    background: linear-gradient(90deg, #5db85c, #f5c842);
    border-radius: 3px;
    transition: width .3s;
  }
  .reset-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 2px 10px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 11px;
  }
  .reset-btn:hover { color: var(--text); border-color: var(--text); }

  /* ── Main layout ─────────────────────────────────────────────────────── */
  main { max-width: 920px; margin: 0 auto; padding: 20px 16px 60px; }

  /* ── Custom checkbox ─────────────────────────────────────────────────── */
  .cb {
    appearance: none;
    -webkit-appearance: none;
    width: 15px; height: 15px;
    border: 2px solid var(--border);
    border-radius: 3px;
    flex-shrink: 0;
    position: relative;
    background: var(--card);
    transition: background .1s, border-color .1s;
    cursor: pointer;
  }
  .cb:checked { background: #5a3e1b; border-color: #c8a050; }
  .cb:checked::after {
    content: '✓';
    position: absolute;
    top: -3px; left: 1px;
    font-size: 11px;
    color: #f5c842;
  }

  /* ── Room ────────────────────────────────────────────────────────────── */
  .room { margin-bottom: 30px; }

  .room-hdr {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 18px;
    border-radius: 8px 8px 0 0;
    cursor: pointer;
    user-select: none;
    transition: opacity .25s;
  }
  .room-hdr.done { opacity: .4; }

  .room-title { font-size: 19px; font-weight: 700; color: #fff; letter-spacing: .04em; }
  .room-hdr.done .room-title { text-decoration: line-through; }

  .room-reward {
    margin-left: auto;
    font-size: 11px;
    color: rgba(255,255,255,.65);
    font-style: italic;
  }
  .room-caret { font-size: 19px; font-weight: 700; color: #fff; }

  .room-body {
    border: 1px solid var(--border);
    border-top: none;
    border-radius: 0 0 8px 8px;
    overflow: hidden;
  }
  .room-body.collapsed { display: none; }

  /* ── Bundle ──────────────────────────────────────────────────────────── */
  .bundle { border-bottom: 1px solid var(--border); }
  .bundle:last-child { border-bottom: none; }

  .bundle-hdr {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 16px;
    background: #221808;
    cursor: pointer;
    user-select: none;
    transition: opacity .25s;
  }
  .bundle-hdr.done { opacity: .35; }

  .bundle-caret { font-size: 13px; font-weight: 700; color: #c8a050; }
  .bundle-name  { font-size: 13px; font-weight: 700; color: #c8a050; }
  .bundle-hdr.done .bundle-caret,
  .bundle-hdr.done .bundle-name { text-decoration: line-through; color: var(--done-fg); }

  .bundle-reward { font-size: 11px; color: var(--muted); margin-left: 6px; }
  .bundle-choose { font-size: 11px; color: #7ba8d0; margin-left: 4px; }
  .bundle-prog   { font-size: 11px; color: var(--muted); margin-left: auto; }

  .bundle-body { padding: 2px 0; }
  .bundle-body.collapsed { display: none; }

  /* ── Item row ────────────────────────────────────────────────────────── */
  .item-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 16px 5px 32px;
    cursor: pointer;
    transition: background .1s;
  }
  .item-row:hover { background: #382c14; }
  .item-row.done { background: var(--done-bg); }
  .item-row.done .item-icon { filter: grayscale(1); opacity: .35; }

  .item-icon {
    width: 32px; height: 32px;
    image-rendering: pixelated;
    flex-shrink: 0;
  }

  .item-text { flex: 1; min-width: 0; }

  .item-main { display: flex; align-items: baseline; gap: 4px; flex-wrap: wrap; }

  .item-name { font-weight: 700; color: var(--text); }
  .item-row.done .item-name { text-decoration: line-through; color: var(--done-fg); }

  .item-qty     { color: var(--muted); font-size: 12px; }
  .item-quality { color: #c8a050; font-size: 11px; }

  .item-obtain {
    color: var(--muted);
    font-size: 12px;
    font-style: italic;
    margin-top: 1px;
  }
  .item-row.done .item-obtain { color: #444; }
</style>
</head>

// ── Storage ───────────────────────────────────────────────────────────────
function skey(bundleId, idx) { return `sdv_${bundleId}_${idx}`; }

// ── Build DOM ─────────────────────────────────────────────────────────────
function render() {
  const main = document.getElementById('main');
  const nav  = document.getElementById('nav');

  ROOMS.forEach(room => {
    // Nav link
    const a = document.createElement('a');
    a.href = '#' + room.id;
    a.textContent = room.name;
    a.style.background = room.color;
    nav.appendChild(a);

    main.appendChild(buildRoom(room));
  });

  updateProgress();
}

function buildRoom(room) {
  const sec = document.createElement('section');
  sec.className = 'room';
  sec.id = room.id;

  // Header
  const hdr = document.createElement('div');
  hdr.className = 'room-hdr';
  hdr.style.background = room.color;

  const caret  = el('span', {className:'room-caret'}, '▼');
  const title  = el('span', {className:'room-title'}, room.name);
  const reward = el('span', {className:'room-reward'}, '→ ' + room.reward);
  hdr.append(caret, title, reward);

  // Body
  const body = document.createElement('div');
  body.className = 'room-body';
  room.bundles.forEach(bundle => body.appendChild(buildBundle(bundle)));

  hdr.addEventListener('click', () => {
    const collapsed = body.classList.toggle('collapsed');
    caret.textContent = collapsed ? '▶' : '▼';
  });

  sec.append(hdr, body);
  computeRoom(sec);
  return sec;
}

function buildBundle(bundle) {
  const div = document.createElement('div');
  div.className = 'bundle';
  div.dataset.needed = bundle.needed;
  div.dataset.total  = bundle.items.length;

  // Header
  const hdr = document.createElement('div');
  hdr.className = 'bundle-hdr';

  const bcaret = el('span', {className:'bundle-caret'}, '▼');
  const name   = el('span', {className:'bundle-name'},   bundle.name);
  hdr.append(bcaret, name);

  if (bundle.reward) {
    hdr.appendChild(el('span', {className:'bundle-reward'}, '↩ ' + bundle.reward));
  }
  if (bundle.needed < bundle.items.length) {
    hdr.appendChild(el('span', {className:'bundle-choose'},
      `(choose ${bundle.needed} of ${bundle.items.length})`));
  }
  const prog = el('span', {className:'bundle-prog'});
  hdr.appendChild(prog);

  // Body
  const body = document.createElement('div');
  body.className = 'bundle-body';
  bundle.items.forEach((item, idx) => {
    body.appendChild(buildItem(item, skey(bundle.id, idx)));
  });

  hdr.addEventListener('click', () => {
    const collapsed = body.classList.toggle('collapsed');
    bcaret.textContent = collapsed ? '▶' : '▼';
  });

  div.append(hdr, body);
  computeBundle(div);
  return div;
}

function buildItem(item, key) {
  const checked = localStorage.getItem(key) === '1';

  const row = document.createElement('div');
  row.className = 'item-row' + (checked ? ' done' : '');

  const cb = el('input', {type:'checkbox', className:'cb'});
  cb.checked = checked;

  // Optional icon
  const iconFile = ICONS[item.name];
  if (iconFile) {
    const img = el('img', {className:'item-icon', src:'img/'+iconFile, alt:''});
    img.onerror = () => img.style.display = 'none';
    row.append(cb, img);
  } else {
    row.appendChild(cb);
  }

  // Text block
  const text = document.createElement('div');
  text.className = 'item-text';

  const main = document.createElement('div');
  main.className = 'item-main';
  main.appendChild(el('span', {className:'item-name'}, item.name));
  if (item.qty)     main.appendChild(el('span', {className:'item-qty'},     '×' + item.qty));
  if (item.quality) main.appendChild(el('span', {className:'item-quality'}, item.quality + '+'));
  text.appendChild(main);

  if (item.obtain) {
    text.appendChild(el('div', {className:'item-obtain'}, item.obtain));
  }
  row.appendChild(text);

  const toggle = (on) => {
    localStorage.setItem(key, on ? '1' : '0');
    row.classList.toggle('done', on);
    computeBundle(row.closest('.bundle'));
    computeRoom(row.closest('.room'));
    updateProgress();
  };

  row.addEventListener('click', e => { if (e.target === cb) return; cb.checked = !cb.checked; toggle(cb.checked); });
  cb.addEventListener('change', () => toggle(cb.checked));
  return row;
}

// ── Completion logic ──────────────────────────────────────────────────────
function computeBundle(bundleEl) {
  const needed  = +bundleEl.dataset.needed;
  const total   = +bundleEl.dataset.total;
  const checked = bundleEl.querySelectorAll('.item-row.done').length;
  const done    = checked >= needed;

  const hdr = bundleEl.querySelector('.bundle-hdr');
  hdr.classList.toggle('done', done);

  const prog = hdr.querySelector('.bundle-prog');
  if (needed < total) {
    prog.textContent = done ? '✓' : `${checked} / ${needed}`;
  } else {
    prog.textContent = (done || checked === 0) ? '' : `${checked} / ${total}`;
  }
}

function computeRoom(roomEl) {
  const bundles = roomEl.querySelectorAll('.bundle');
  const allDone = [...bundles].every(b => b.querySelector('.bundle-hdr').classList.contains('done'));
  const hdr = roomEl.querySelector('.room-hdr');
  hdr.classList.toggle('done', allDone);
}

function updateProgress() {
  const all  = document.querySelectorAll('.item-row').length;
  const done = document.querySelectorAll('.item-row.done').length;
  const pct  = all ? Math.round(done / all * 100) : 0;
  document.getElementById('prog-label').textContent = `${done} / ${all} items`;
  document.getElementById('prog-bar').style.width = pct + '%';
}

function resetAll() {
  if (!confirm('Reset all checkboxes?')) return;
  Object.keys(localStorage).filter(k => k.startsWith('sdv_')).forEach(k => localStorage.removeItem(k));
  document.querySelectorAll('.item-row').forEach(r => {
    r.classList.remove('done');
    r.querySelector('.cb').checked = false;
  });
  document.querySelectorAll('.bundle').forEach(b => computeBundle(b));
  document.querySelectorAll('.room').forEach(r => computeRoom(r));
  updateProgress();
}

// ── Tiny helper ───────────────────────────────────────────────────────────
function el(tag, props = {}, text) {
  const e = document.createElement(tag);
  Object.assign(e, props);
  if (text !== undefined) e.textContent = text;
  return e;
}

render();
</script>
